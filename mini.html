<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent 协作</title>
    <style>
      /* 悬浮窗必须透明：窗口本身是 Frameless + Transparent，
         这里再铺底色会变成一整块黑（曾经踩过）。 */
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        background: transparent;
        /* 不要 height:100% —— 会让内容不参与撑高 */
        /* 不要 overflow:hidden —— 会让 toast 被裁 */
      }
      body {
        font-family: ui-sans-serif, -apple-system, 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      [role='button'] {
        --app-region: no-drag;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mini.tsx"></script>
  </body>
</html>
